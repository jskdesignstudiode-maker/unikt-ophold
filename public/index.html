<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unikt Ophold samler glamping og særlige overnatninger i Danmark: telte, hytter, trætophuse og husbåde.">
<title>Unikt Ophold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: calm portal in the manner of a hotel booking site. White header, pale hero with a ghosted Dannebrog cross and a raised search card, red kept for buttons and small accents. */
:root {
  --red: #C8102E;
  --red-deep: #A50D26;
  --red-text: #B50E29;
  --red-tint: #FBECEF;
  --hero-stripe: rgba(200, 16, 46, 0.055);
  --bg: #FFFFFF;
  --surface: #F6F4F4;
  --line: #E4E0E1;
  --fg: #1F1A1B;
  --muted: #655D5F;
  --focus: #B50E29;
  --shadow: 0 6px 24px rgba(31, 26, 27, 0.08);
  --ill-sky: #F1EBEC;
  --ill-ground: #E0D6D8;
  --ill-water: #D9E1E4;
  --ill-shape: #FFFFFF;
  --ill-line: #C8102E;
  --font-display: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #D9344A;
    --red-deep: #C42A40;
    --red-text: #F27489;
    --red-tint: rgba(217, 52, 74, 0.16);
    --hero-stripe: rgba(217, 52, 74, 0.09);
    --bg: #131011;
    --surface: #1B1517;
    --line: #342B2E;
    --fg: #F4EFEF;
    --muted: #ABA0A3;
    --focus: #F27489;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    --ill-sky: #221B1D;
    --ill-ground: #2C2326;
    --ill-water: #2A3438;
    --ill-shape: #3A2F32;
    --ill-line: #E0566A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #D9344A;
  --red-deep: #C42A40;
  --red-text: #F27489;
  --red-tint: rgba(217, 52, 74, 0.16);
  --hero-stripe: rgba(217, 52, 74, 0.09);
  --bg: #131011;
  --surface: #1B1517;
  --line: #342B2E;
  --fg: #F4EFEF;
  --muted: #ABA0A3;
  --focus: #F27489;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
  --ill-sky: #221B1D;
  --ill-ground: #2C2326;
  --ill-water: #2A3438;
  --ill-shape: #3A2F32;
  --ill-line: #E0566A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p { margin: 0; }
button, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap {
  width: 100%;
  max-width: 1180px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Buttons */
.btn {
  display: inline-block;
  font-weight: 600;
  padding: 12px 22px;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
  text-decoration: none;
  line-height: 1.3;
  transition: background-color .15s ease;
}
.btn-red { background: var(--red); color: #FFFFFF; }
.btn-red:hover { background: var(--red-deep); }

/* Header */
.top { background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; letter-spacing: 0.01em; }
.mark { width: 30px; height: auto; display: block; flex: none; --mark-bg: var(--red); --mark-x: #FFFFFF; }
.mark .bg { fill: var(--mark-bg); }
.mark .x { fill: var(--mark-x); }
.nav { display: flex; align-items: center; gap: 28px; }
.nav-links { display: flex; gap: 28px; }
.nav-links a { text-decoration: none; font-size: 0.95rem; }
.nav-links a:hover { text-decoration: underline; text-underline-offset: 4px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.lang button { background: transparent; border: 0; padding: 6px 11px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button:hover { background: var(--surface); }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Hero */
.hero { position: relative; overflow: hidden; background: var(--surface); border-bottom: 1px solid var(--line); }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.hero-bg::before {
  content: "";
  position: absolute; top: 0; bottom: 0; left: 32.4%;
  width: clamp(24px, 4.5vw, 64px);
  background: var(--hero-stripe);
}
.hero-bg::after {
  content: "";
  position: absolute; left: 0; right: 0; top: 42.9%;
  height: clamp(24px, 4.5vw, 64px);
  background: var(--hero-stripe);
}
.hero-in { position: relative; z-index: 1; padding-block: clamp(36px, 6vw, 64px) 44px; }
.hero-copy { max-width: 780px; }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red-text); }
.hero h1 {
  margin-top: 14px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2.2rem, 5.6vw, 3.8rem);
  line-height: 1.07;
  letter-spacing: -0.015em;
  text-wrap: balance;
  max-width: 20ch;
}
.hero-copy .lead { margin-top: 16px; font-size: 1.08rem; max-width: 56ch; color: var(--muted); }

.search {
  margin-top: 32px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  box-shadow: var(--shadow);
  padding: 20px;
  display: grid;
  grid-template-columns: 1.2fr 1.2fr 0.8fr auto;
  gap: 14px;
  align-items: end;
  max-width: 980px;
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.field select {
  width: 100%;
  min-width: 0;
  padding: 12px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  cursor: pointer;
}
.field select:hover { border-color: var(--muted); }
.search .btn { padding-block: 13px; }
.search-note { margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
.usp { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 0.95rem; }
.usp li { display: flex; align-items: center; gap: 8px; }
.usp svg { width: 18px; height: 18px; flex: none; color: var(--red); }

/* Sections */
.section { padding-block: 64px; }
.section.alt { background: var(--surface); }
.section-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; max-width: 64ch; }
.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.6rem, 3.4vw, 2.2rem); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); }
.note { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: 0.9rem; color: var(--muted); }
.note .pill { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red-text); border: 1px solid var(--red-text); padding: 1px 8px; border-radius: 2px; }

/* Browse: filters + results */
.browse { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 32px; align-items: start; }
.results { min-width: 0; }
.filter-toggle {
  display: none;
  align-items: center; gap: 10px;
  padding: 10px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  font-weight: 600;
  cursor: pointer;
}
.badge { background: var(--red); color: #FFFFFF; min-width: 22px; padding: 0 6px; border-radius: 2px; font-size: 0.8rem; text-align: center; }
.filters {
  display: flex; flex-direction: column; gap: 22px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 20px;
  min-width: 0;
}
.filters-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.filters-head h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; }
.reset { background: none; border: 0; padding: 0; color: var(--red-text); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.fgroup { border: 0; margin: 0; padding: 0; min-width: 0; }
.fgroup legend { padding: 0; margin-bottom: 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; font-size: 0.95rem; }
.check input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--red); cursor: pointer; }
.amen { display: flex; flex-direction: column; gap: 18px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 2px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: border-color .15s ease, background-color .15s ease;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--red-tint); border-color: var(--red); color: var(--red-text); font-weight: 600; }
.count { margin-bottom: 18px; color: var(--muted); font-size: 0.9rem; }

/* Listing cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 24px; }
.card { display: flex; flex-direction: column; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.card-fig { position: relative; margin: 0; aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; background: var(--ill-sky); }
.card-fig svg { display: block; width: 100%; height: 100%; }
.card-body { display: flex; flex-direction: column; gap: 6px; padding: 16px; flex: 1; }
.tag-ad {
  position: absolute; top: 12px; left: 12px;
  background: #FFFFFF; color: #A50D26;
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 2px;
}
.card-meta { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card-title { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; line-height: 1.25; text-wrap: balance; }
.card-tags { font-size: 0.88rem; color: var(--muted); }
.card-row { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-row b { color: var(--fg); font-weight: 600; }
.card-link {
  margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--line);
  font-weight: 600; text-decoration: none; color: var(--red-text);
}
.card-body .card-row { margin-bottom: 8px; }
.card-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.empty { grid-column: 1 / -1; padding: 24px 0; color: var(--muted); }
.empty b { color: var(--fg); display: block; }

/* Regions */
.regions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px; }
.rcard { background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 24px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rname { font-family: var(--font-display); font-weight: 500; font-size: 1.45rem; }
.rdesc { color: var(--muted); font-size: 0.95rem; }
.rlabel { margin-top: 10px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.sights { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sights li { display: flex; flex-direction: column; font-size: 0.95rem; }
.sights b { font-weight: 600; }
.sights span { color: var(--muted); font-size: 0.88rem; }
.rlinks { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 22px; }
.rlink { padding: 0; background: none; border: 0; text-align: left; color: var(--red-text); font-weight: 600; font-size: 1rem; cursor: pointer; text-decoration: none; }
.rlink:hover { text-decoration: underline; text-underline-offset: 4px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 0.9rem; color: var(--muted); }
.crumbs a { color: var(--red-text); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; text-underline-offset: 4px; }
.rp-intro { max-width: 62ch; font-size: 1.08rem; }

/* Stay detail page */
.card-fig img { display: block; width: 100%; height: 100%; object-fit: cover; }
.stay-badges { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 4px 0 0; }
.stay-badges li { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; font-size: 0.9rem; border-radius: 2px; }
.stay-top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.stay-hero { margin: 0; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 2px; background: var(--surface); }
.stay-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stay-aside { border: 1px solid var(--line); border-radius: 2px; padding: 24px; background: var(--bg); display: flex; flex-direction: column; gap: 14px; }
.stay-aside dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 0.95rem; }
.stay-aside dt { color: var(--muted); }
.stay-aside dd { margin: 0; text-align: right; }
.stay-aside .btn { width: 100%; text-align: center; justify-content: center; }
.stay-note { font-size: 0.85rem; color: var(--muted); }
.stay-gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.stay-gal button { padding: 0; border: 0; background: var(--surface); aspect-ratio: 4 / 3; overflow: hidden; border-radius: 2px; cursor: zoom-in; }
.stay-gal img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s; }
.stay-gal button:hover img { transform: scale(1.03); }
.stay-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 40px 48px; }
.stay-sec h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; margin-bottom: 12px; }
.stay-sec p, .stay-sec li { color: var(--text); line-height: 1.6; }
.stay-sec ul { padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; margin: 0; }
.stay-sec p + p { margin-top: 10px; }
.extras { display: grid; gap: 12px; }
.extra { border: 1px solid var(--line); border-radius: 2px; padding: 16px 18px; background: var(--bg); }
.extra b { font-weight: 600; }
.extra .ep { color: var(--red-text); font-weight: 600; margin-left: 10px; white-space: nowrap; }
.extra p { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
.ptable { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.ptable th, .ptable td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.ptable th:first-child, .ptable td:first-child { white-space: normal; }
.stay-cols.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.ptable th:first-child, .ptable td:first-child { text-align: left; }
.ptable th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
.lb { position: fixed; inset: 0; z-index: 100; background: rgba(10, 8, 9, 0.92); display: flex; align-items: center; justify-content: center; padding: 56px 16px 16px; }
.lb[hidden] { display: none; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb button { position: absolute; background: rgba(255,255,255,0.14); color: #fff; border: 0; width: 44px; height: 44px; font-size: 1.4rem; border-radius: 2px; cursor: pointer; }
.lb button:hover { background: rgba(255,255,255,0.28); }
.lb .lb-x { top: 8px; right: 8px; }
.lb .lb-p { left: 8px; top: 50%; }
.lb .lb-n { right: 8px; top: 50%; }
.lb .lb-c { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 0.9rem; padding: 0 60px; }
@media (max-width: 860px) { .stay-top { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.tlinks { display: flex; flex-wrap: wrap; gap: 10px; }
.tlink { display: inline-block; padding: 10px 16px; border: 1px solid var(--line); border-radius: 2px; background: var(--bg); color: var(--text); text-decoration: none; font-size: 0.95rem; }
.tlink:hover { border-color: var(--red-text); color: var(--red-text); }

/* Tips and criteria */
.tips, .criteria { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 32px; }
.crit { border-top: 1px solid var(--line); padding-top: 18px; }
.crit h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; margin-bottom: 8px; }
.crit p { color: var(--muted); }

/* FAQ */
.faq { max-width: 820px; }
.qa { border-top: 1px solid var(--line); }
.qa:last-child { border-bottom: 1px solid var(--line); }
.qa summary { list-style: none; cursor: pointer; padding: 18px 0; font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; display: flex; justify-content: space-between; gap: 16px; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary::after { content: "+"; color: var(--red-text); font-size: 1.4rem; line-height: 1; flex: none; }
.qa[open] summary::after { content: "\2013"; }
.qa p { color: var(--muted); padding-bottom: 20px; max-width: 62ch; }

/* Host page */
.page-head { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 36px 40px; }
.page-head .wrap { display: flex; flex-direction: column; gap: 12px; max-width: 1180px; }
.back { font-size: 0.95rem; text-decoration: none; color: var(--red-text); font-weight: 600; width: fit-content; }
.back:hover { text-decoration: underline; text-underline-offset: 4px; }
.page-head h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; max-width: 22ch; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px; max-width: 880px; }
.plan { background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.plan.feat { border: 2px solid var(--red); }
.plan h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; }
.plan .price { font-family: var(--font-display); font-size: 1.15rem; color: var(--red-text); font-weight: 500; }
.plan ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.plan li::marker { color: var(--red-text); }
.fine { margin-top: 20px; font-size: 0.9rem; color: var(--muted); max-width: 62ch; }
.cta-row { margin-top: 28px; }

/* Footer */
.foot { border-top: 1px solid var(--line); background: var(--surface); padding-block: 44px 28px; }
.foot-in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; }
.foot p.about { color: var(--muted); font-size: 0.9rem; max-width: 46ch; margin-top: 12px; }
.foot nav { display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
.foot nav a { text-decoration: none; }
.foot nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.legal { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }

/* Toast */
.toast {
  position: fixed; z-index: 20;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 440px;
  background: var(--fg); color: var(--bg);
  padding: 14px 18px; border-radius: 2px; font-size: 0.95rem;
}

@media (max-width: 860px) {
  .search { grid-template-columns: 1fr 1fr; }
  .search .btn { grid-column: 1 / -1; }
  .nav-links { display: none; }
  .browse { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .filter-toggle { display: inline-flex; justify-self: start; }
  .filters { display: none; }
  .filters.open { display: flex; }

    midtjylland: {"id": "mj", "da": {"intro": "Midtjylland samler søer, skove og Aarhus, Danmarks næststørste by. Det er et godt udgangspunkt, hvis du vil kombinere ro i naturen med kultur og gode spisesteder. Her samler vi håndplukkede glampingtelte, hytter og andre særlige overnatninger.", "sights": ["Bakken ligger over Søhøjlandet og giver udsigt over søer og skov. Der er stier til både korte og lange ture.", "Museet har en rund glaspanorama på taget, hvor du går rundt i alle regnbuens farver. Tjek åbningstider, før du tager afsted.", "Museet sydvest for Aarhus fortæller om forhistorien og vikingetiden i Danmark. Det passer godt til en regnvejrsdag."], "tips": [["Kombinér natur og by", "Bo ude i naturen, og tag en dag til Aarhus. Du får både stilhed og byliv uden at skifte ophold."], ["Tag cyklen med til søerne", "Området omkring søerne egner sig til cykel og kajak. Spørg værten, om der er udstyr at låne eller leje i nærheden."], ["Book i god tid om sommeren", "Populære ophold nær søerne er hurtigt optaget i højsæsonen. Planlæg gerne flere måneder frem."]], "faq": [["Hvad kan man opleve i Midtjylland?", "Søerne, skovene og Aarhus med museer og restauranter. Mange ophold ligger tæt på vand, hvor du kan bade eller sejle."], ["Er Midtjylland godt for børn?", "Ja, der er mange muligheder for familier, både i naturen og i byerne. Brug filteret for børnevenlige ophold."]]}, "de": {"intro": "Mitteljütland vereint Seen, Wälder und Aarhus, die zweitgrößte Stadt Dänemarks. Es ist ein guter Ausgangspunkt, wenn du Ruhe in der Natur mit Kultur und guten Restaurants verbinden willst. Hier sammeln wir handverlesene Glamping-Zelte, Hütten und andere besondere Unterkünfte.", "sights": ["Der Hügel liegt über dem Seenland und bietet Aussicht über Seen und Wald. Es gibt Wege für kurze und lange Touren.", "Das Museum hat auf dem Dach einen runden Glasgang in allen Regenbogenfarben. Prüfe die Öffnungszeiten, bevor du losfährst.", "Das Museum südwestlich von Aarhus erzählt von der Vorgeschichte und der Wikingerzeit in Dänemark. Es passt gut zu einem Regentag."], "tips": [["Natur und Stadt verbinden", "Wohne draußen in der Natur und nimm dir einen Tag für Aarhus. So hast du Stille und Stadtleben, ohne die Unterkunft zu wechseln."], ["Fahrrad zu den Seen mitnehmen", "Die Gegend um die Seen eignet sich für Rad und Kajak. Frag den Gastgeber, ob es in der Nähe Ausrüstung zum Leihen gibt."], ["Im Sommer früh buchen", "Beliebte Unterkünfte nahe den Seen sind in der Hochsaison schnell ausgebucht. Plane gern mehrere Monate im Voraus."]], "faq": [["Was kann man in Mitteljütland erleben?", "Die Seen, die Wälder und Aarhus mit Museen und Restaurants. Viele Unterkünfte liegen nah am Wasser, wo du baden oder paddeln kannst."], ["Ist Mitteljütland gut für Kinder?", "Ja, es gibt viele Möglichkeiten für Familien, in der Natur und in den Städten. Nutze den Filter für kinderfreundliche Unterkünfte."]]}, "en": {"intro": "Central Jutland brings together lakes, forests and Aarhus, Denmark’s second-largest city. It is a good base if you want to combine peace in nature with culture and good places to eat. Here we collect handpicked glamping tents, cabins and other unique stays.", "sights": ["The hill rises over the lake district and gives views over lakes and forest. There are paths for both short and long walks.", "The museum has a round glass walkway on the roof in all the colours of the rainbow. Check opening hours before you go.", "The museum southwest of Aarhus tells the story of prehistory and the Viking age in Denmark. It suits a rainy day well."], "tips": [["Combine nature and city", "Stay out in nature and take a day in Aarhus. You get quiet and city life without changing stay."], ["Bring bikes to the lakes", "The area around the lakes suits cycling and kayaking. Ask the host whether there is equipment to borrow or rent nearby."], ["Book early in summer", "Popular stays near the lakes fill up quickly in high season. Plan several months ahead."]], "faq": [["What can you do in Central Jutland?", "The lakes, the forests and Aarhus with museums and restaurants. Many stays are close to water where you can swim or paddle."], ["Is Central Jutland good for children?", "Yes, there are many options for families, in nature and in the cities. Use the filter for child-friendly stays."]]}},
    sydjylland: {"id": "sj", "da": {"intro": "Sydjylland rummer Vadehavet, Danmarks ældste by og stor, flad natur, hvor himlen fylder meget. Her kan du kombinere ro ved havet med oplevelser for hele familien. Her samler vi håndplukkede glampingtelte, hytter og andre særlige overnatninger.", "sights": ["Byen er kendt som Danmarks ældste og har skæve huse, brostensgader og en domkirke. Gå en tur gennem det gamle centrum.", "Tidevandsøen i Vadehavet kan kun nås ad vejen ved lavvande. Tjek tidevandstabellen, og kør kun, når der er åbent.", "Forlystelsesparken i Billund har modeller i legoklodser og passer til børnefamilier. Mange gæster tager en hel dag."], "tips": [["Tjek tidevandet", "I Vadehavet skifter vandstanden hurtigt. Følg lokale anvisninger, før du går eller kører ud på havbunden."], ["Planlæg legolanddagen", "Parken er travl i skoleferien. Køb billetter i forvejen, og overvej en hverdag."], ["Se efter fugle om efteråret", "Vadehavet er kendt for store flokke af trækfugle. Tag kikkert med, og spørg lokalt om gode steder."]], "faq": [["Hvad er Vadehavet?", "Det er et stort tidevandsområde langs kysten, hvor havet trækker sig tilbage ved ebbe. Det er en populær destination for natur og fugleliv."], ["Hvordan kommer jeg rundt i Sydjylland?", "Bil er den nemmeste måde at nå både byer og naturområder. Mange ophold ligger uden for byerne."]]}, "de": {"intro": "Südjütland umfasst das Wattenmeer, Dänemarks älteste Stadt und weite, flache Natur, in der der Himmel viel Raum einnimmt. Hier kannst du Ruhe am Meer mit Erlebnissen für die ganze Familie verbinden. Hier sammeln wir handverlesene Glamping-Zelte, Hütten und andere besondere Unterkünfte.", "sights": ["Die Stadt gilt als Dänemarks älteste und hat schiefe Häuser, Kopfsteinpflaster und einen Dom. Mach einen Spaziergang durch die Altstadt.", "Die Gezeiteninsel im Wattenmeer ist nur bei Niedrigwasser über die Straße erreichbar. Prüfe die Gezeitentabelle und fahre nur, wenn geöffnet ist.", "Der Freizeitpark in Billund zeigt Modelle aus Legosteinen und passt zu Familien mit Kindern. Viele Gäste bleiben einen ganzen Tag."], "tips": [["Gezeiten prüfen", "Im Wattenmeer wechselt der Wasserstand schnell. Folge den örtlichen Hinweisen, bevor du auf den Meeresboden gehst oder fährst."], ["Den Legoland-Tag planen", "Der Park ist in den Schulferien voll. Kaufe Tickets im Voraus und überlege einen Wochentag."], ["Im Herbst auf Vögel achten", "Das Wattenmeer ist für große Zugvogelschwärme bekannt. Nimm ein Fernglas mit und frag vor Ort nach guten Plätzen."]], "faq": [["Was ist das Wattenmeer?", "Es ist ein großes Gezeitengebiet entlang der Küste, in dem sich das Meer bei Ebbe zurückzieht. Es ist ein beliebtes Ziel für Natur und Vogelwelt."], ["Wie komme ich in Südjütland herum?", "Das Auto ist am einfachsten, um sowohl Städte als auch Naturgebiete zu erreichen. Viele Unterkünfte liegen außerhalb der Städte."]]}, "en": {"intro": "South Jutland holds the Wadden Sea, Denmark’s oldest town and wide, flat nature where the sky takes up a lot of room. Here you can combine peace by the sea with experiences for the whole family. Here we collect handpicked glamping tents, cabins and other unique stays.", "sights": ["The town is known as Denmark’s oldest and has crooked houses, cobbled streets and a cathedral. Take a walk through the old centre.", "The tidal island in the Wadden Sea can only be reached by road at low tide. Check the tide table and drive only when it is open.", "The theme park in Billund shows models built from toy bricks and suits families with children. Many guests stay a whole day."], "tips": [["Check the tide", "In the Wadden Sea the water level changes quickly. Follow local guidance before you walk or drive out onto the seabed."], ["Plan the Legoland day", "The park is busy in school holidays. Buy tickets in advance and consider a weekday."], ["Watch for birds in autumn", "The Wadden Sea is known for large flocks of migrating birds. Bring binoculars and ask locally for good spots."]], "faq": [["What is the Wadden Sea?", "It is a large tidal area along the coast where the sea retreats at low tide. It is a popular destination for nature and birdlife."], ["How do I get around South Jutland?", "A car is the easiest way to reach both towns and nature areas. Many stays are outside the towns."]]}},
    fyn: {"id": "fyn", "da": {"intro": "Fyn kaldes ofte Danmarks have: bløde marker, små landsbyer og et sydfynsk øhav med rolige farvande. Afstandene er korte, så du kan se meget på få dage. Her samler vi håndplukkede glampingtelte, hytter og andre særlige overnatninger.", "sights": ["Slottet fra 1500-tallet ligger i vand og har en stor have. Det er et af de mest besøgte slotte i Danmark.", "Museet i Odense fortæller om digterens liv og eventyr. Byen er også godt at gå rundt i til fods.", "Øen syd for Fyn har små byer med farverige huse og gode cykelruter. Du kommer dertil med færge."], "tips": [["Tag færgen til øerne", "Øerne i det sydfynske øhav er lette at nå med færge. Tjek afgangstider og book bil i forvejen om sommeren."], ["Lej en cykel", "Fyn er forholdsvis fladt og har mange cykelruter. Spørg værten, om der er cykler i nærheden."], ["Besøg lokale gårdbutikker", "Mange gårde sælger frugt og grønt direkte. Det er en god måde at smage egnen på."]], "faq": [["Hvad er sydfynske øhav?", "Det er en gruppe små øer syd for Fyn med rolige farvande. Det er populært til sejlads, kajak og cykelture."], ["Er Fyn godt til en weekendtur?", "Ja, afstandene er korte, og der er meget at se. Mange ophold ligger tæt på både natur og byer."]]}, "de": {"intro": "Fünen wird oft Dänemarks Garten genannt: sanfte Felder, kleine Dörfer und ein südfünisches Inselmeer mit ruhigen Gewässern. Die Wege sind kurz, sodass du in wenigen Tagen viel sehen kannst. Hier sammeln wir handverlesene Glamping-Zelte, Hütten und andere besondere Unterkünfte.", "sights": ["Das Schloss aus dem 16. Jahrhundert liegt im Wasser und hat einen großen Garten. Es gehört zu den meistbesuchten Schlössern Dänemarks.", "Das Museum in Odense erzählt vom Leben und von den Märchen des Dichters. Die Stadt lässt sich auch gut zu Fuß erkunden.", "Die Insel südlich von Fünen hat kleine Städte mit bunten Häusern und gute Radrouten. Du erreichst sie mit der Fähre."], "tips": [["Mit der Fähre zu den Inseln", "Die Inseln im südfünischen Inselmeer sind leicht mit der Fähre zu erreichen. Prüfe die Abfahrtszeiten und buche im Sommer das Auto im Voraus."], ["Ein Fahrrad leihen", "Fünen ist relativ flach und hat viele Radrouten. Frag den Gastgeber, ob es in der Nähe Fahrräder gibt."], ["Lokale Hofläden besuchen", "Viele Höfe verkaufen Obst und Gemüse direkt. So schmeckst du die Gegend."]], "faq": [["Was ist das südfünische Inselmeer?", "Es ist eine Gruppe kleiner Inseln südlich von Fünen mit ruhigen Gewässern. Es ist beliebt für Segeln, Kajak und Radtouren."], ["Ist Fünen gut für ein Wochenende?", "Ja, die Wege sind kurz, und es gibt viel zu sehen. Viele Unterkünfte liegen nah an Natur und Städten."]]}, "en": {"intro": "Funen is often called Denmark’s garden: soft fields, small villages and a South Funen archipelago with calm waters. Distances are short, so you can see a lot in a few days. Here we collect handpicked glamping tents, cabins and other unique stays.", "sights": ["The 16th-century castle stands in water and has a large garden. It is one of the most visited castles in Denmark.", "The museum in Odense tells of the author’s life and fairy tales. The town is also good to explore on foot.", "The island south of Funen has small towns with colourful houses and good cycle routes. You get there by ferry."], "tips": [["Take the ferry to the islands", "The islands in the South Funen archipelago are easy to reach by ferry. Check departure times and book your car in advance in summer."], ["Rent a bike", "Funen is fairly flat and has many cycle routes. Ask the host whether there are bikes nearby."], ["Visit local farm shops", "Many farms sell fruit and vegetables directly. It is a good way to taste the area."]], "faq": [["What is the South Funen archipelago?", "It is a group of small islands south of Funen with calm waters. It is popular for sailing, kayaking and cycling."], ["Is Funen good for a weekend trip?", "Yes, distances are short and there is a lot to see. Many stays are close to both nature and towns."]]}},
    sjaelland: {"id": "sjl", "da": {"intro": "Sjælland har både hovedstadens tempo og rolige kyster, skove og bakker. Mange ophold ligger inden for en times kørsel fra København, men føles langt væk. Her samler vi håndplukkede glampingtelte, hytter og andre særlige overnatninger.", "sights": ["Slottet i Helsingør kendes som Hamlets slot. Det ligger ved Øresund og kan besøges hele året.", "Kunstmuseet i Humlebæk ligger ud mod Øresund og er kendt for samtidskunst og skulpturpark. Det er værd at afsætte tid til haven.", "De hvide kridtklinter på Møn rejser sig over havet. Der er trapper ned til stranden, og stien langs toppen giver udsigt."], "tips": [["Brug toget til København", "Mange ophold ligger tæt på stationer. Tjek, om du kan tage toget ind til byen en dag."], ["Gå ned ad trapperne ved klinten", "Trappen ned til stranden under Møns Klint har mange trin. Tag fornuftigt fodtøj på."], ["Undgå weekenderne om sommeren", "Kysterne nær København er travle på varme weekender. Hverdage giver mere ro."]], "faq": [["Kan man bo i naturen tæt på København?", "Ja, flere ophold ligger i skov eller ved kysten inden for kort kørsel. Se listen for aktuelle eksempler."], ["Hvornår er det bedst at besøge Møns Klint?", "Om sommeren er der flest besøgende. Tidlig morgen eller sen eftermiddag giver ofte mere ro."]]}, "de": {"intro": "Seeland bietet das Tempo der Hauptstadt ebenso wie ruhige Küsten, Wälder und Hügel. Viele Unterkünfte liegen höchstens eine Autostunde von Kopenhagen entfernt, fühlen sich aber weit weg an. Hier sammeln wir handverlesene Glamping-Zelte, Hütten und andere besondere Unterkünfte.", "sights": ["Das Schloss in Helsingør ist als Hamlets Schloss bekannt. Es liegt am Öresund und kann das ganze Jahr besucht werden.", "Das Kunstmuseum in Humlebæk liegt am Öresund und ist für zeitgenössische Kunst und seinen Skulpturenpark bekannt. Plane Zeit für den Garten ein.", "Die weißen Kreidefelsen auf Møn ragen über dem Meer auf. Treppen führen zum Strand, und der Weg oben bietet Aussicht."], "tips": [["Mit dem Zug nach Kopenhagen", "Viele Unterkünfte liegen nah an Bahnhöfen. Prüfe, ob du an einem Tag mit dem Zug in die Stadt fahren kannst."], ["Treppen an den Klippen", "Die Treppe zum Strand unter Møns Klint hat viele Stufen. Zieh festes Schuhwerk an."], ["Sommerwochenenden meiden", "Die Küsten nahe Kopenhagen sind an warmen Wochenenden voll. Wochentage bringen mehr Ruhe."]], "faq": [["Kann man in der Natur nahe Kopenhagen wohnen?", "Ja, einige Unterkünfte liegen im Wald oder an der Küste, in kurzer Fahrt entfernt. Aktuelle Beispiele findest du in der Liste."], ["Wann ist die beste Zeit für Møns Klint?", "Im Sommer sind die meisten Besucher da. Früher Morgen oder später Nachmittag bringen oft mehr Ruhe."]]}, "en": {"intro": "Zealand offers the pace of the capital as well as quiet coasts, forests and hills. Many stays are within an hour’s drive of Copenhagen but feel far away. Here we collect handpicked glamping tents, cabins and other unique stays.", "sights": ["The castle in Helsingør is known as Hamlet’s castle. It stands by the Øresund and can be visited all year.", "The art museum in Humlebæk lies by the Øresund and is known for contemporary art and its sculpture park. Set aside time for the garden.", "The white chalk cliffs on Møn rise above the sea. Stairs lead down to the beach, and the path along the top gives views."], "tips": [["Use the train to Copenhagen", "Many stays are close to stations. Check whether you can take the train into the city for a day."], ["Mind the stairs at the cliffs", "The stairs down to the beach below Møns Klint have many steps. Wear sensible shoes."], ["Avoid summer weekends", "The coasts near Copenhagen are busy on warm weekends. Weekdays are calmer."]], "faq": [["Can you stay in nature close to Copenhagen?", "Yes, several stays are in forest or by the coast within a short drive. See the list for current examples."], ["When is the best time to visit Møns Klint?", "Summer has the most visitors. Early morning or late afternoon is often calmer."]]}},
    bornholm: {"id": "bh", "da": {"intro": "Bornholm ligger midt i Østersøen og adskiller sig fra resten af Danmark med klipper, røgerier og små havnebyer. Øen er lille nok til at udforske på cykel. Her samler vi håndplukkede glampingtelte, hytter og andre særlige overnatninger.", "sights": ["Ruinen ligger på en klippe i nordvest og er Nordeuropas største borgruin. Der er stier rundt om området.", "Den lille ø med fæstning nordøst for Bornholm kan nås med færge. Her kører ingen biler.", "Stranden i sydøst er kendt for sin fine, hvide sand. Den er et populært udflugtsmål om sommeren."], "tips": [["Book færge i god tid", "Overfarten til Bornholm bliver hurtigt booket om sommeren. Planlæg både færge og ophold tidligt."], ["Brug cyklen", "Øen har et net af cykelstier. Det er en god måde at se landskab og små byer på."], ["Prøv de lokale røgerier", "Bornholm er kendt for sin røgede fisk. Spørg værten, hvor der er et godt sted i nærheden."]], "faq": [["Hvordan kommer jeg til Bornholm?", "Der er færge og fly. Færgen sejler blandt andet fra Ystad i Sverige og fra Køge til Rønne. Tjek aktuelle ruter og tider."], ["Er Bornholm godt uden for sommeren?", "Mange steder har lukket i vinterhalvåret, men naturen er stadig smuk. Tjek åbningstider og opvarmning på det enkelte ophold."]]}, "de": {"intro": "Bornholm liegt mitten in der Ostsee und unterscheidet sich mit Felsen, Räuchereien und kleinen Hafenstädten vom Rest Dänemarks. Die Insel ist klein genug, um sie mit dem Rad zu erkunden. Hier sammeln wir handverlesene Glamping-Zelte, Hütten und andere besondere Unterkünfte.", "sights": ["Die Ruine liegt auf einem Felsen im Nordwesten und ist die größte Burgruine Nordeuropas. Rund um das Gelände gibt es Wege.", "Die kleine Insel mit Festung nordöstlich von Bornholm erreichst du mit der Fähre. Hier fahren keine Autos.", "Der Strand im Südosten ist für seinen feinen weißen Sand bekannt. Im Sommer ist er ein beliebtes Ausflugsziel."], "tips": [["Fähre früh buchen", "Die Überfahrt nach Bornholm ist im Sommer schnell ausgebucht. Plane Fähre und Unterkunft früh."], ["Das Rad nutzen", "Die Insel hat ein Netz von Radwegen. So siehst du Landschaft und kleine Orte am besten."], ["Lokale Räuchereien probieren", "Bornholm ist für geräucherten Fisch bekannt. Frag den Gastgeber nach einem guten Platz in der Nähe."]], "faq": [["Wie komme ich nach Bornholm?", "Es gibt Fähre und Flug. Die Fähre fährt unter anderem ab Ystad in Schweden oder ab Køge nach Rønne. Prüfe aktuelle Routen und Zeiten."], ["Ist Bornholm auch außerhalb des Sommers schön?", "Viele Orte haben im Winterhalbjahr geschlossen, aber die Natur bleibt schön. Prüfe Öffnungszeiten und Heizung bei der einzelnen Unterkunft."]]}, "en": {"intro": "Bornholm lies in the middle of the Baltic Sea and stands apart from the rest of Denmark with cliffs, smokehouses and small harbour towns. The island is small enough to explore by bike. Here we collect handpicked glamping tents, cabins and other unique stays.", "sights": ["The ruin sits on a rock in the northwest and is northern Europe’s largest castle ruin. There are paths around the area.", "The small island with a fortress northeast of Bornholm can be reached by ferry. No cars are driven here.", "The beach in the southeast is known for its fine white sand. It is a popular day trip in summer."], "tips": [["Book the ferry early", "The crossing to Bornholm books up fast in summer. Plan ferry and stay early."], ["Use a bike", "The island has a network of cycle paths. It is a good way to see landscape and small towns."], ["Try the local smokehouses", "Bornholm is known for smoked fish. Ask the host for a good place nearby."]], "faq": [["How do I get to Bornholm?", "There are ferries and flights. Ferries run from Ystad in Sweden and from Køge to Rønne, among others. Check current routes and times."], ["Is Bornholm good outside summer?", "Many places close in the winter half-year, but the nature is still beautiful. Check opening hours and heating on the individual stay."]]}}

  var THEMES = {
    glamping: { k: 'type', v: 'glamping',
      da: { h1: 'Glamping i Danmark', intro: 'Glamping er camping med komfort: rigtige senge og en bolig, der allerede er sat op. Her finder du telte og andre lette overnatninger tæt på naturen, uden at du skal slæbe et helt telt med.', faq: [['Hvad er forskellen på glamping og camping?', 'Ved glamping er telt eller bolig og seng som regel allerede på plads. Du kommer med tøj og mad, og resten er klart.'], ['Hvornår kan man glampe i Danmark?', 'Mange steder har åbent fra forår til efterår. Nogle har opvarmning og holder åbent længere, så tjek altid det enkelte ophold.']] },
      de: { h1: 'Glamping in Dänemark', intro: 'Glamping ist Camping mit Komfort: echte Betten und eine Unterkunft, die schon aufgebaut ist. Hier findest du Zelte und andere leichte Unterkünfte nah an der Natur, ohne ein ganzes Zelt mitschleppen zu müssen.', faq: [['Was ist der Unterschied zwischen Glamping und Camping?', 'Beim Glamping sind Zelt oder Unterkunft und Bett in der Regel schon aufgebaut. Du bringst Kleidung und Essen mit, der Rest ist bereit.'], ['Wann kann man in Dänemark glampen?', 'Viele Orte haben von Frühling bis Herbst geöffnet. Manche haben eine Heizung und länger geöffnet, prüfe also immer die einzelne Unterkunft.']] },
      en: { h1: 'Glamping in Denmark', intro: 'Glamping is camping with comfort: real beds and a stay that is already set up. Here you find tents and other light stays close to nature, without having to haul a whole tent along.', faq: [['What is the difference between glamping and camping?', 'With glamping the tent or cabin and the bed are usually already in place. You bring clothes and food, and the rest is ready.'], ['When can you go glamping in Denmark?', 'Many places are open from spring to autumn. Some have heating and stay open longer, so always check the individual stay.']] } },
    cabin: { k: 'type', v: 'cabin',
      da: { h1: 'Hytter og små huse', intro: 'En hytte giver dig faste vægge, varme og ofte eget køkken. Det er et godt valg, hvis du vil have ro og plads, også uden for sommeren.', faq: [['Er hytterne egnede om vinteren?', 'Mange har varme og isolering, men det varierer. Tjek opvarmning på det enkelte ophold.'], ['Kan jeg lave mad selv?', 'Mange hytter har køkken eller køkkenkrog. Brug filteret for køkken for at finde dem.']] },
      de: { h1: 'Hütten und kleine Häuser', intro: 'Eine Hütte bietet feste Wände, Wärme und oft eine eigene Küche. Sie ist eine gute Wahl, wenn du Ruhe und Platz willst, auch außerhalb des Sommers.', faq: [['Sind die Hütten im Winter geeignet?', 'Viele haben Heizung und Dämmung, aber das ist unterschiedlich. Prüfe die Heizung bei der einzelnen Unterkunft.'], ['Kann ich selbst kochen?', 'Viele Hütten haben eine Küche oder Kochnische. Nutze den Filter für die Küche, um sie zu finden.']] },
      en: { h1: 'Cabins and small houses', intro: 'A cabin gives you solid walls, warmth and often your own kitchen. It is a good choice if you want peace and space, also outside summer.', faq: [['Are the cabins suitable in winter?', 'Many have heating and insulation, but it varies. Check the heating on the individual stay.'], ['Can I cook for myself?', 'Many cabins have a kitchen or kitchenette. Use the kitchen filter to find them.']] } },
    treehouse: { k: 'type', v: 'treehouse',
      da: { h1: 'Trætophuse', intro: 'Et trætophus ligger oppe mellem trækronerne og giver en særlig følelse af at være væk fra hverdagen. Husene er ofte små, så de passer bedst til par og små familier.', faq: [['Er trætophuse sikre for børn?', 'Det afhænger af det enkelte hus, for eksempel trapper og rækværk. Spørg værten, hvis du rejser med små børn.'], ['Er der toilet og bad?', 'Det varierer. Nogle har eget bad, andre deler faciliteter. Det står på det enkelte ophold.']] },
      de: { h1: 'Baumhäuser', intro: 'Ein Baumhaus liegt oben zwischen den Baumkronen und vermittelt ein besonderes Gefühl, dem Alltag entrückt zu sein. Die Häuser sind oft klein und passen am besten zu Paaren und kleinen Familien.', faq: [['Sind Baumhäuser für Kinder sicher?', 'Das hängt vom einzelnen Haus ab, zum Beispiel Treppen und Geländer. Frag den Gastgeber, wenn du mit kleinen Kindern reist.'], ['Gibt es Toilette und Bad?', 'Das ist unterschiedlich. Manche haben ein eigenes Bad, andere teilen sich die Einrichtungen. Es steht bei der einzelnen Unterkunft.']] },
      en: { h1: 'Treehouses', intro: 'A treehouse sits up among the treetops and gives a special feeling of being away from everyday life. The houses are often small, so they suit couples and small families best.', faq: [['Are treehouses safe for children?', 'It depends on the individual house, for example stairs and railings. Ask the host if you travel with small children.'], ['Is there a toilet and bathroom?', 'It varies. Some have their own bathroom, others share facilities. It is stated on the individual stay.']] } },
    houseboat: { k: 'type', v: 'houseboat',
      da: { h1: 'Husbåde', intro: 'På en husbåd bor du på vandet med havn, fjord eller sø lige uden for døren. Det er et roligt og anderledes alternativ til en almindelig ferielejlighed.', faq: [['Skal jeg kunne sejle?', 'Ikke nødvendigvis. Spørg værten, om båden ligger fast eller kan sejle, og om det kræver bevis.'], ['Er husbåde egnede til børn?', 'Det kan de være, men vand kræver opmærksomhed. Spørg om rækværk og redningsveste.']] },
      de: { h1: 'Hausboote', intro: 'Auf einem Hausboot wohnst du auf dem Wasser, mit Hafen, Fjord oder See direkt vor der Tür. Es ist eine ruhige und andere Alternative zur normalen Ferienwohnung.', faq: [['Muss ich segeln oder fahren können?', 'Nicht unbedingt. Frag den Gastgeber, ob das Boot fest liegt oder fahren kann und ob dafür ein Schein nötig ist.'], ['Sind Hausboote für Kinder geeignet?', 'Das können sie sein, aber Wasser erfordert Aufmerksamkeit. Frag nach Geländer und Rettungswesten.']] },
      en: { h1: 'Houseboats', intro: 'On a houseboat you live on the water with a harbour, fjord or lake right outside the door. It is a calm and different alternative to an ordinary holiday flat.', faq: [['Do I need to know how to sail?', 'Not necessarily. Ask the host whether the boat is moored or can sail, and whether a licence is needed.'], ['Are houseboats suitable for children?', 'They can be, but water needs attention. Ask about railings and life jackets.']] } },
    tiny: { k: 'type', v: 'tiny',
      da: { h1: 'Tiny houses', intro: 'Et tiny house er et lille hus med det vigtigste på få kvadratmeter. Det passer til dig, der vil bo enkelt og tæt på naturen.', faq: [['Hvor mange kan sove i et tiny house?', 'Som regel to til fire personer, men se det enkelte ophold.'], ['Er der plads til bagage?', 'Pladsen er begrænset, så pak let. Spørg værten om opbevaring, hvis du er i tvivl.']] },
      de: { h1: 'Tiny Houses', intro: 'Ein Tiny House ist ein kleines Haus mit dem Wichtigsten auf wenigen Quadratmetern. Es passt zu dir, wenn du einfach und nah an der Natur wohnen willst.', faq: [['Wie viele Personen können in einem Tiny House schlafen?', 'In der Regel zwei bis vier Personen, aber sieh dir die einzelne Unterkunft an.'], ['Ist Platz für Gepäck?', 'Der Platz ist begrenzt, also pack leicht. Frag den Gastgeber nach Stauraum, wenn du unsicher bist.']] },
      en: { h1: 'Tiny houses', intro: 'A tiny house is a small house with the essentials in a few square metres. It suits you if you want to live simply and close to nature.', faq: [['How many people can sleep in a tiny house?', 'Usually two to four people, but see the individual stay.'], ['Is there room for luggage?', 'Space is limited, so pack light. Ask the host about storage if you are unsure.']] } },
    farm: { k: 'type', v: 'farm',
      da: { h1: 'Ferie på gården', intro: 'På en gård bor du på landet med marker, dyr og åbent landskab omkring dig. Det er ofte et godt valg for familier, der vil have plads og tid.', faq: [['Kan børn møde dyrene?', 'Mange gårde har dyr, men det er ikke en garanti. Spørg værten, hvilke dyr der er, og om børn må komme tæt på.'], ['Er morgenmad inkluderet?', 'Nogle gårde tilbyder morgenmad, andre ikke. Brug filteret for morgenmad.']] },
      de: { h1: 'Urlaub auf dem Bauernhof', intro: 'Auf einem Hof wohnst du auf dem Land, mit Feldern, Tieren und offener Landschaft um dich herum. Das ist oft eine gute Wahl für Familien, die Platz und Zeit wollen.', faq: [['Können Kinder die Tiere treffen?', 'Viele Höfe haben Tiere, aber das ist keine Garantie. Frag den Gastgeber, welche Tiere es gibt und ob Kinder nah herankommen dürfen.'], ['Ist Frühstück inklusive?', 'Manche Höfe bieten Frühstück an, andere nicht. Nutze den Filter für Frühstück.']] },
      en: { h1: 'Farm stays', intro: 'On a farm you stay in the countryside with fields, animals and open landscape around you. It is often a good choice for families who want space and time.', faq: [['Can children meet the animals?', 'Many farms have animals, but it is no guarantee. Ask the host which animals there are and whether children may come close.'], ['Is breakfast included?', 'Some farms offer breakfast, others do not. Use the breakfast filter.']] } },
    sauna: { k: 'am', v: 'sauna',
      da: { h1: 'Overnatning med sauna', intro: 'Sauna og kolde dage hører sammen. Her finder du ophold med sauna, enten ved huset eller delt med andre gæster.', faq: [['Er saunaen privat?', 'Det varierer. Nogle ophold har egen sauna, andre en fælles. Det står i beskrivelsen.'], ['Koster sauna ekstra?', 'Nogle værter tager ekstra betaling eller kræver varsel for at fyre op. Spørg, før du booker.']] },
      de: { h1: 'Übernachten mit Sauna', intro: 'Sauna und kalte Tage gehören zusammen. Hier findest du Unterkünfte mit Sauna, entweder am Haus oder mit anderen Gästen geteilt.', faq: [['Ist die Sauna privat?', 'Das ist unterschiedlich. Manche Unterkünfte haben eine eigene Sauna, andere eine gemeinsame. Es steht in der Beschreibung.'], ['Kostet die Sauna extra?', 'Manche Gastgeber verlangen einen Aufpreis oder Vorlauf zum Anheizen. Frag vor der Buchung nach.']] },
      en: { h1: 'Stays with a sauna', intro: 'Sauna and cold days go together. Here you find stays with a sauna, either at the house or shared with other guests.', faq: [['Is the sauna private?', 'It varies. Some stays have their own sauna, others a shared one. It is stated in the description.'], ['Does the sauna cost extra?', 'Some hosts charge extra or need notice to heat it. Ask before you book.']] } },
    whirlpool: { k: 'am', v: 'whirlpool',
      da: { h1: 'Ophold med whirlpool', intro: 'Et varmt bad under åben himmel gør en kort tur til noget særligt. Her finder du ophold med whirlpool eller udendørs spabad.', faq: [['Er whirlpoolen altid varm?', 'Ofte skal den varmes op først, og det kan tage tid. Spørg værten, hvor længe det tager.'], ['Er whirlpool med i prisen?', 'Nogle værter tager ekstra betaling. Se beskrivelsen eller spørg værten.']] },
      de: { h1: 'Unterkünfte mit Whirlpool', intro: 'Ein warmes Bad unter freiem Himmel macht aus einem Kurztrip etwas Besonderes. Hier findest du Unterkünfte mit Whirlpool oder Außenbad.', faq: [['Ist der Whirlpool immer warm?', 'Oft muss er erst aufgeheizt werden, und das kann dauern. Frag den Gastgeber, wie lange es dauert.'], ['Ist der Whirlpool im Preis enthalten?', 'Manche Gastgeber verlangen einen Aufpreis. Sieh in die Beschreibung oder frag den Gastgeber.']] },
      en: { h1: 'Stays with a hot tub', intro: 'A warm bath under the open sky makes a short trip something special. Here you find stays with a hot tub or outdoor spa.', faq: [['Is the hot tub always warm?', 'Often it has to be heated first, which can take time. Ask the host how long it takes.'], ['Is the hot tub included in the price?', 'Some hosts charge extra. See the description or ask the host.']] } },
    dogs: { k: 'am', v: 'dogs',
      da: { h1: 'Ophold med hund', intro: 'Din hund er velkommen. Her finder du ophold, hvor hunde må være med, så ferien ikke kræver hundepension.', faq: [['Koster det ekstra at have hund med?', 'Nogle værter tager et gebyr. Spørg, før du booker.'], ['Hvor mange hunde må jeg have med?', 'Det bestemmer værten. Skriv til værten, hvis du har flere hunde.']] },
      de: { h1: 'Urlaub mit Hund', intro: 'Dein Hund ist willkommen. Hier findest du Unterkünfte, in denen Hunde mitkommen dürfen, sodass dein Urlaub keine Hundepension braucht.', faq: [['Kostet der Hund extra?', 'Manche Gastgeber verlangen eine Gebühr. Frag vor der Buchung nach.'], ['Wie viele Hunde darf ich mitbringen?', 'Das entscheidet der Gastgeber. Schreib dem Gastgeber, wenn du mehrere Hunde hast.']] },
      en: { h1: 'Dog-friendly stays', intro: 'Your dog is welcome. Here you find stays where dogs may come along, so your holiday does not need a kennel.', faq: [['Does a dog cost extra?', 'Some hosts charge a fee. Ask before you book.'], ['How many dogs can I bring?', 'The host decides. Write to the host if you have several dogs.']] } },
    kids: { k: 'am', v: 'kids',
      da: { h1: 'Ophold for familier med børn', intro: 'Børn har brug for plads til at lege og trygge rammer. Her finder du ophold, der passer til familier.', faq: [['Er der barneseng eller højstol?', 'Det varierer. Spørg værten på forhånd.'], ['Hvad skal jeg tænke på med børn og vand?', 'Tjek, om der er sø, fjord eller hav tæt på, og hold øje med børnene. Spørg om rækværk eller redningsveste.']] },
      de: { h1: 'Unterkünfte für Familien mit Kindern', intro: 'Kinder brauchen Platz zum Spielen und einen sicheren Rahmen. Hier findest du Unterkünfte, die zu Familien passen.', faq: [['Gibt es ein Kinderbett oder einen Hochstuhl?', 'Das ist unterschiedlich. Frag den Gastgeber vorher.'], ['Woran muss ich bei Kindern und Wasser denken?', 'Prüfe, ob See, Fjord oder Meer in der Nähe sind, und behalte die Kinder im Blick. Frag nach Geländer oder Rettungswesten.']] },
      en: { h1: 'Stays for families with children', intro: 'Children need room to play and a safe setting. Here you find stays that suit families.', faq: [['Is there a cot or high chair?', 'It varies. Ask the host in advance.'], ['What should I think about with children and water?', 'Check whether a lake, fjord or sea is close by, and keep an eye on the children. Ask about railings or life jackets.']] } }
  };

    }).join('');
  }

  function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function renderStay(slug) {
    var st = STAYS[slug];
    if (!st) return;
    curStay = slug;
    var c = st[lang] || st.da;
    var d = DATA.filter(function (x) { return x.id === st.id; })[0];
    var g0 = st.gallery[0];
    var crumbs = '<nav class="crumbs" aria-label="' + t('crumb_label') + '"><a href="#top">' + t('crumb_home') + '</a><span aria-hidden="true">›</span><a href="#ophold">' + t('s1_label') + '</a><span aria-hidden="true">›</span><span aria-current="page">' + c.title + '</span></nav>';
    var head = '<section class="page-head"><div class="wrap">' + crumbs + '<h1>' + c.title + '</h1><p class="sub rp-intro">' + c.sub + '</p></div></section>';
    var facts = c.facts.map(function (f) { return '<dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>'; }).join('');
    var priceFrom = d && d.price != null ? '<p><b>' + t('from_pre') + ' ' + fmt(d.price) + ' kr</b> ' + t('per_night') + '</p>' : '';
    var top = '<section class="section"><div class="wrap"><div class="stay-top"><div>' +
      '<figure class="stay-hero"><img src="img/' + g0[0] + '.webp" alt="' + esc(g0[1][lang] || g0[1].da) + '" width="1600" height="900"></figure>' +
      '<p class="rp-intro" style="margin-top:20px">' + c.intro + '</p>' +
      '<ul class="stay-badges">' + c.badges.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul></div>' +
      '<aside class="stay-aside">' + priceFrom + '<dl>' + facts + '</dl>' +
      '<a class="btn btn-red" href="' + st.book + '" target="_blank" rel="noopener">' + c.book + ' ↗</a>' +
      '<a class="btn" href="tel:' + st.phone + '" style="border:1px solid var(--line)">' + c.call + ': ' + st.phoneLabel + '</a>' +
      '<p class="stay-note">' + c.book_note + '</p></aside></div></div></section>';
    function sec(x) {
      return '<div class="stay-sec"><h2>' + x.h + '</h2>' + (x.p ? x.p.map(function (q) { return '<p>' + q + '</p>'; }).join('') : '') +
        (x.ul ? '<ul>' + x.ul.map(function (q) { return '<li>' + q + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    }
    var extras = '<div class="stay-sec"><h2>' + c.extras_h + '</h2><div class="extras">' + c.extras.map(function (e) {
      return '<div class="extra"><b>' + e[0] + '</b><span class="ep">' + e[1] + '</span><p>' + e[2] + '</p></div>';
    }).join('') + '</div></div>';
    var table = '<div class="stay-sec"><h2>' + c.prices_h + '</h2><table class="ptable"><thead><tr>' + c.price_cols.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      c.prices.map(function (r) { return '<tr>' + r.map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table><p class="stay-note" style="margin-top:10px">' + c.price_note + '</p></div>';
    var loc = '<div class="stay-sec"><h2>' + c.loc_h + '</h2><p>' + c.loc_p + '</p><ul style="margin-top:10px">' + c.loc_ul.map(function (q) { return '<li>' + q + '</li>'; }).join('') + '</ul><p>' + c.loc_extra + '</p></div>';
    var rules = sec({ h: c.rules_h, ul: c.rules }), pay = sec({ h: c.pay_h, ul: c.pay }), know = sec({ h: c.know_h, ul: c.know });
    var body = '<section class="section alt"><div class="wrap"><div class="stay-cols two">' + c.secs.map(sec).join('') + '</div></div></section>' +
      '<section class="section"><div class="wrap"><div class="stay-cols">' + extras + table + '</div></div></section>' +
      '<section class="section alt"><div class="wrap"><div class="stay-cols">' + loc + rules + pay + know + '</div></div></section>';
    var gal = '<section class="section"><div class="wrap"><div class="section-head"><h2>' + c.gallery_h + '</h2></div><div class="stay-gal">' +
      st.gallery.map(function (gi, i) {
        return '<button type="button" data-lb="' + i + '"><img src="img/t/' + gi[0] + '.webp" alt="' + esc(gi[1][lang] || gi[1].da) + '" loading="lazy" width="720" height="540"></button>';
      }).join('') + '</div>' +
      '<p class="stay-note" style="margin-top:28px">' + c.own + '</p>' +
      '<div class="cta-row"><a class="btn btn-red" href="' + st.book + '" target="_blank" rel="noopener">' + c.book + ' ↗</a><a class="rlink" href="#ophold">← ' + c.back + '</a></div></div></section>';
    $('view-stay').innerHTML = head + top + body + gal;
  }

  var lbIdx = 0;
  function lbShow(i) {
    var st = STAYS[curStay]; if (!st) return;
    var n = st.gallery.length;
    lbIdx = (i + n) % n;
    var gi = st.gallery[lbIdx], c = st[lang] || st.da;
    $('lb-i').src = 'img/' + gi[0] + '.webp';
    $('lb-i').alt = gi[1][lang] || gi[1].da;
    $('lb-c').textContent = (gi[1][lang] || gi[1].da) + ' (' + (lbIdx + 1) + '/' + n + ')';
    $('lb-x').setAttribute('aria-label', c.close); $('lb-p').setAttribute('aria-label', c.prev); $('lb-n').setAttribute('aria-label', c.next);
    $('lb').hidden = false;
    $('lb-x').focus();
  }
  function lbHide() { $('lb').hidden = true; $('lb-i').removeAttribute('src'); }
  $('lb-x').addEventListener('click', lbHide);
  $('lb-p').addEventListener('click', function () { lbShow(lbIdx - 1); });
  $('lb-n').addEventListener('click', function () { lbShow(lbIdx + 1); });
  $('lb').addEventListener('click', function (e) { if (e.target === this) lbHide(); });
  document.addEventListener('keydown', function (e) {
    if ($('lb').hidden) return;
    if (e.key === 'Escape') lbHide();
    else if (e.key === 'ArrowLeft') lbShow(lbIdx - 1);
    else if (e.key === 'ArrowRight') lbShow(lbIdx + 1);
  });
  $('view-stay').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-lb]') : null;
    if (b) lbShow(parseInt(b.getAttribute('data-lb'), 10));
  });

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('uo-lang', l); } catch (e) {}
    applyStatic();
    buildControls();
    render();
    if (curGuide && !$('view-region').hidden) renderGuide(curGuide);
    if (curTheme && !$('view-theme').hidden) renderTheme(curTheme, curThemeReg);
    if (curStay && !$('view-stay').hidden) { renderStay(curStay); if (!$('lb').hidden) lbShow(lbIdx); }
  }

  function toList() {
    $('ophold').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
  }

  var timer;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(function () { el.hidden = true; }, 3400);
  }

  // Three views: home, host page (#hosts) and region guides (#nordjylland)
  var view = 'home';
  function route() {
    var h = (location.hash || '').replace('#', '');
    var tp = h.indexOf('t-') === 0 ? h.slice(2).split('~') : [];
    var isTheme = !!THEMES[tp[0]] && (!tp[1] || REGION_IDS.indexOf(tp[1]) > -1);
    var next = h === 'hosts' ? 'hosts' : (GUIDES[h] ? 'region' : (isTheme ? 'theme' : (STAYS[h] ? 'stay' : 'home')));
    $('view-home').hidden = next !== 'home';
    $('view-hosts').hidden = next !== 'hosts';
    $('view-region').hidden = next !== 'region';
    $('view-theme').hidden = next !== 'theme';
    $('view-stay').hidden = next !== 'stay';
    if (!$('lb').hidden) lbHide();
    document.title = next === 'stay' ? STAYS[h].da.title + ' – Unikt Ophold' : 'Unikt Ophold';
    if (next === 'region') renderGuide(h);
    if (next === 'theme') renderTheme(tp[0], tp[1]);
    if (next === 'stay') renderStay(h);
    if (next !== 'home') { window.scrollTo(0, 0); view = next; return; }
    if (view !== 'home') {
      view = 'home';
      var el = h && h !== 'top' ? $(h) : null;
      if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' }); else window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-toast-key],[data-type],[data-region],[data-lang],[data-theme-go]') : null;
    if (!el) return;
    if (el.hasAttribute('data-theme-go')) {
      var th = THEMES[el.getAttribute('data-theme-go')];
      state = { type: th.k === 'type' ? th.v : '', region: el.getAttribute('data-region') || '', guests: 1, price: 0, am: {} };
      if (th.k === 'am') state.am[th.v] = true;
      render();
      location.hash = 'ophold';
      return;
    }
    if (el.hasAttribute('data-lang')) { setLang(el.getAttribute('data-lang')); return; }
    if (el.hasAttribute('data-toast-key')) { e.preventDefault(); toast(t(el.getAttribute('data-toast-key'))); return; }
    if (el.classList.contains('chip')) { state.type = el.getAttribute('data-type'); render(); return; }
    if (el.hasAttribute('data-go')) { state.region = el.getAttribute('data-region'); render(); location.hash = 'ophold'; return; }
    if (el.classList.contains('rlink')) { state.region = el.getAttribute('data-region'); render(); toList(); }
  });

  $('search').addEventListener('submit', function (e) {
    e.preventDefault();
    state.region = $('f-region').value;
    state.type = $('f-type').value;
    state.guests = parseInt($('f-guests').value, 10) || 1;
    render();
    toList();
  });
  $('s-region').addEventListener('change', function () { state.region = this.value; render(); });
  $('s-guests').addEventListener('change', function () { state.guests = parseInt(this.value, 10) || 1; render(); });
  $('s-price').addEventListener('change', function () { state.price = parseInt(this.value, 10) || 0; render(); });
  $('amen').addEventListener('change', function (e) {
    if (e.target && e.target.type === 'checkbox') { state.am[e.target.value] = e.target.checked; render(); }
  });
  $('reset').addEventListener('click', function () {
    state = { type: '', region: '', guests: 1, price: 0, am: {} };
    render();
  });
  $('filter-toggle').addEventListener('click', function () {
    var open = $('filters').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  window.addEventListener('hashchange', route);

  setLang(lang);
  route();
})();
</script>
</body>
</html>
